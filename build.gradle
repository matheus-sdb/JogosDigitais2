apply plugin: 'application'

def mainClassName = 'io.github.triotiles.lwjgl3.Lwjgl3Launcher'

sourceSets.main.resources.srcDirs += [rootProject.file('assets').path]

application {
  applicationName = 'TrioTiles'
  mainClass = mainClassName
}

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

run {
  workingDir = rootProject.file('assets')
  // No macOS o GLFW precisa rodar na thread principal.
  if (System.getProperty('os.name').toLowerCase().contains('mac')) {
    jvmArgs += '-XstartOnFirstThread'
  }
}

// Gera um .jar único com tudo dentro: lwjgl3/build/libs/TrioTiles-<versão>.jar
// (sempre nesta pasta, mesmo quando o resto do build vai para fora por causa de acento no caminho)
jar {
  archiveBaseName.set('TrioTiles')
  destinationDirectory = layout.projectDirectory.dir('build/libs')
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  dependsOn configurations.runtimeClasspath
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
  exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
  manifest {
    attributes 'Main-Class': mainClassName
  }
}
