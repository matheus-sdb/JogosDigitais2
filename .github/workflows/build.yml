name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Arquivos enviados pelo site do GitHub ("Add files via upload") ou extraídos de um .zip
      # perdem a permissão de execução, e editores do Windows podem trocar o fim de linha.
      # Isso deixa o gradlew funcionando em qualquer repositório, de qualquer jeito que ele foi enviado.
      - name: Preparar o gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Compilar
        run: ./gradlew build

      - name: Publicar o .jar do jogo
        uses: actions/upload-artifact@v4
        with:
          name: TrioTiles-jar
          path: lwjgl3/build/libs/*.jar

  # Executável para Windows (TrioTiles.exe com o Java embutido). O jpackage só gera .exe no Windows.
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # O cmd do Windows lê errado .bat com fim de linha do Linux; garante CRLF,
      # mesmo se o arquivo foi enviado pelo site sem o .gitattributes.
      - name: Preparar o gradlew.bat
        shell: pwsh
        run: (Get-Content gradlew.bat) | Set-Content -Encoding ascii gradlew.bat

      - name: Gerar o executável
        shell: cmd
        run: gradlew.bat lwjgl3:packageWindows

      # O artefato baixado já é um .zip com a pasta TrioTiles/ (abra o TrioTiles.exe).
      - name: Publicar o executável
        uses: actions/upload-artifact@v4
        with:
          name: TrioTiles-windows
          path: lwjgl3/build/jpackage/image/
